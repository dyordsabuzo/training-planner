# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
  workflow_dispatch:


jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: yarn install && yarn build
        env:
          VITE_FBASE_APIKEY: ${{ secrets.VITE_FBASE_APIKEY }}
          VITE_FBASE_AUTHDOMAIN: ${{ secrets.VITE_FBASE_AUTHDOMAIN }}
          VITE_FBASE_PROJECTID: ${{ secrets.VITE_FBASE_PROJECTID }}
          VITE_FBASE_APPID: ${{ secrets.VITE_FBASE_APPID }}
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRAINING_PLANNER_387200 }}
          channelId: live
          projectId: training-planner-387200

      # action-hosting-deploy only ever deploys Hosting. Anything else declared
      # in firebase.json (currently just Firestore rules) needs the CLI directly.
      - name: Write Firebase service account credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRAINING_PLANNER_387200 }}' > "${{ runner.temp }}/firebase-service-account.json"

      - name: Deploy Firestore rules
        run: yarn firebase deploy --only firestore:rules --project training-planner-387200
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

      - name: Clean up service account credentials
        if: always()
        run: rm -f "${{ runner.temp }}/firebase-service-account.json"
