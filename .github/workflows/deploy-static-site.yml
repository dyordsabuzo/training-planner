name: Deploy static content to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install and Build
        run: |
          yarn install
          yarn build
        env:
          VITE_FBASE_APIKEY: ${{secrets.REACT_APP_FBASE_APIKEY}}
          VITE_FBASE_AUTHDOMAIN: ${{secrets.REACT_APP_FBASE_AUTHDOMAIN}}
          VITE_FBASE_PROJECTID: ${{secrets.REACT_APP_FBASE_PROJECTID}}
          VITE_FBASE_APPID: ${{secrets.REACT_APP_FBASE_APPID}}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: './build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
