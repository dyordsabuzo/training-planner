name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: yarn install && yarn build
        env:
          VITE_FBASE_APIKEY: ${{secrets.REACT_APP_FBASE_APIKEY}}
          VITE_FBASE_AUTHDOMAIN: ${{secrets.REACT_APP_FBASE_AUTHDOMAIN}}
          VITE_FBASE_PROJECTID: ${{secrets.REACT_APP_FBASE_PROJECTID}}
          VITE_FBASE_APPID: ${{secrets.REACT_APP_FBASE_APPID}}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRAINING_PLANNER_387200 }}
          projectId: training-planner-387200
